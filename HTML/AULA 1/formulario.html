   <meta charset="UTF-8">
  <title>Formulário de Cadastro</title>
    </head>
    <body>
        <form action="#" method="post">
            <h2>Formulário de Cadastro</h2>
    
            
            <div>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
    
            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
    
            
            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
    
         
            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="0" max="120" required>
            </div>
    
           
            <div>
                <span>Sexo:</span>
                <label for="masculino">
                    <input type="radio" id="masculino" name="sexo" value="masculino" required> Masculino
                </label>
                <label for="feminino">
                    <input type="radio" id="feminino" name="sexo" value="feminino"> Feminino
                </label>
                <label for="outro">
                    <input type="radio" id="outro" name="sexo" value="outro"> Outro
                </label>
            </div>
    
           
            <div>
               
                <label for="interesse1">
                    <input type="checkbox" id="interesse1" name="interesses" value="tecnologia"> Tecnologia
                </label>
                <label for="interesse2">
                    <input type="checkbox" id="interesse2" name="interesses" value="esportes"> Esportes
                </label>
                <label for="interesse3">
                    <input type="checkbox" id="interesse3" name="interesses" value="musica"> Música
                </label>
                <label for="interesse4">
                    <input type="checkbox" id="interesse4" name="interesses" value="leitura"> Leitura
                </label>
                <label for="interesse5">
                    <input type="checkbox" id="interesse5" name="interesses" value="viagens"> Viagens
                </label>
            </div>
    
            <!-- Botão enviar -->
            <div>
                <button type="submit">Enviar Cadastro</button>
            </div>
        </form>
    </body>
    </html>
    </head>
