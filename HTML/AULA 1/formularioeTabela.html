<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Endereço de Entrega</title>
</head>
<body>
    <form action="#" method="post">
        <table border="1" cellpadding="8" cellspacing="0">
            <caption>>Informar o endereço de entrega></caption>
            
            
            <tr>
                <td>Tipo de logradouro:</td>
                <td>
                    <label>
                        <input type="radio" name="tipo_logradouro" value="Rua"> Rua
                    </label><br>
                    <label>
                        <input type="radio" name="tipo_logradouro" value="Avenida"> Avenida
                    </label><br>
                    <label>
                        <input type="radio" name="tipo_logradouro" value="Alameda"> Alameda
                    </label><br>
                    <label>
                        <input type="radio" name="tipo_logradouro" value="Travessa"> Travessa
                    </label>
                </td>
            </tr>
            <!-- Logradouro -->
            <tr>
                <td>Logradouro:</td>
                <td><input type="text" name="logradouro"></td>
            </tr>
            <!-- Número -->
            <tr>
                <td>Número:</td>
                <td><input type="text" name="numero"></td>
            </tr>
            <!-- Bairro -->
            <tr>
                <td>Bairro:</td>
                <td><input type="text" name="bairro"></td>
            </tr>
            <!-- CEP -->
            <tr>
                <td>CEP:</td>
                <td><input type="text" name="cep"></td>
            </tr>
            <!-- Cidade -->
            <tr>
                <td>Cidade:</td>
                <td><input type="text" name="cidade"></td>
            </tr>
            <!-- Botões Enviar e Limpar -->
            <tr>
                <td colspan="2" style="text-align:center;">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
