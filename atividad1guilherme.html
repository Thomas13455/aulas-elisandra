<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento escolar</title>
</head>
<body>
      <div>
        <h1>Cadastro de Alunos</h1>
    
        <form>
          <div>
            <label>Nome do aluno:</label>
            <input type="text" name="nome">
          </div>
    
          <div>
            <label>Série:</label>
            <input type="text" name="serie">
          </div>
    
          <div>
            <label>Nota:</label>
            <input type="number" name="nota">
          </div>
    
          <div>
            <button type="submit">Cadastrar</button>
          </div>
        </form>
      </div>
    
      <br>
    
      <div>
        <h2>Boletim Escolar</h2>
    
        <table border="1">
          <tr>
            <th>Aluno</th>
            <th>Série</th>
            <th>Matéria</th>
            <th>Nota</th>
            <th>Situação</th>
          </tr>
    
          <tr>
            <td>Ana Clara</td>
            <td>2º Ano</td>
            <td>Matemática</td>
            <td>8.5</td>
            <td>Aprovada</td>
          </tr>
    
          <tr>
            <td>Pedro Lucas</td>
            <td>2º Ano</td>
            <td>Português</td>
            <td>6.0</td>
            <td>Aprovado</td>
          </tr>
    
          <tr>
            <td>Mariana Souza</td>
            <td>2º Ano</td>
            <td>História</td>
            <td>4.5</td>
            <td>Recuperação</td>
          </tr>
        </table>
      </div>
    
    </body>
    </html>  
</body>
</html>
